<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranchi Weather - Shanu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:white}
.card{background:rgba(255,255,255,0.15);backdrop-filter:blur(15px);padding:30px;border-radius:25px;text-align:center;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.3)}
h1{margin-bottom:5px}.sub{opacity:0.8;font-size:14px;margin-bottom:20px}
input{width:100%;padding:14px;border-radius:12px;border:none;outline:none;margin-bottom:15px;font-size:16px}
button{width:100%;padding:14px;border-radius:12px;border:none;background:white;color:#764ba2;font-weight:bold;font-size:16px;cursor:pointer}
#result{margin-top:25px;background:rgba(255,255,255,0.2);padding:20px;border-radius:15px;min-height:100px}
.temp{font-size:48px;font-weight:bold}.city{font-size:22px;margin-top:5px}
.footer{margin-top:20px;font-size:12px;opacity:0.7}
</style>
</head>
<body>
<div class="card">
<h1> Weather</h1>
<div class="sub">By Shanu Verma | Ranchi, Jharkhand</div>
<input id="cityInput" type="text" placeholder="City likho, jaise Ranchi">
<button onclick="getWeather()">Check Mausam</button>
<div id="result">Loading Ranchi ka mausam...</div>
<div class="footer">Option 2 - Live API Project</div>
</div>
<script>
async function getWeather(){
 let city=document.getElementById("cityInput").value || "Ranchi";
 let box=document.getElementById("result");
 box.innerHTML="Loading...";
 try{
  letlet r=await fetch(`https://wttr.in/${city}?format=j1`);
  let d=await r.json();
  let c=d.current_condition[0];
  let w=d.weather[0];
